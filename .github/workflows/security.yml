name: Dependency security and bundle verification

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./
        with:
          bun-version: "1.4.3"
          no-cache: true

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun audit

      - name: Verify committed bundles
        run: |
          bun run build
          git diff --exit-code -- dist/setup/index.js dist/cache-save/index.js
